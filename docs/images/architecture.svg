  <rect x="450" y="130" width="190" height="120" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="545" y="170" text-anchor="middle" font-size="18" font-weight="bold" fill="#14532d">Your VPN Server</text>
  <text x="545" y="196" text-anchor="middle" font-size="13" fill="#14532d">WireGuard + NAT</text>
  <text x="545" y="218" text-anchor="middle" font-size="13" fill="#14532d">Tunnel IP 10.8.0.1</text>

  <rect x="720" y="140" width="150" height="100" rx="50" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="795" y="186" text-anchor="middle" font-size="18" font-weight="bold" fill="#4c1d95">Internet</text>
  <text x="795" y="208" text-anchor="middle" font-size="12" fill="#4c1d95">Sees server's IP</text>

  <line x1="200" y1="190" x2="258" y2="190" stroke="#374151" stroke-width="3" marker-end="url(#a)"/>
  <line x1="390" y1="190" x2="448" y2="190" stroke="#374151" stroke-width="3" marker-end="url(#a)"/>
  <line x1="640" y1="190" x2="718" y2="190" stroke="#374151" stroke-width="3" marker-end="url(#a)"/>

  <rect x="30" y="285" width="610" height="14" rx="7" fill="#16a34a" opacity="0.35"/>
  <text x="335" y="320" text-anchor="middle" font-size="14" fill="#14532d" font-weight="bold">🔒 Encrypted tunnel (ChaCha20-Poly1305)</text>
  <line x1="115" y1="250" x2="115" y2="285" stroke="#16a34a" stroke-dasharray="4"/>
  <line x1="545" y1="250" x2="545" y2="285" stroke="#16a34a" stroke-dasharray="4"/>
  <text x="795" y="285" text-anchor="middle" font-size="13" fill="#4c1d95">Normal (unencrypted by VPN)</text>
  <text x="795" y="303" text-anchor="middle" font-size="13" fill="#4c1d95">traffic leaves here</text>
