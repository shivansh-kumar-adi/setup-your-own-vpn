<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
  </defs>
  <rect width="900" height="380" fill="#f8fafc"/>
  <text x="450" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#111827">Your Own VPN: Architecture</text>

  <rect x="30" y="130" width="170" height="120" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="115" y="170" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e3a8a">Your Laptop</text>
  <text x="115" y="196" text-anchor="middle" font-size="13" fill="#1e3a8a">WireGuard client</text>
  <text x="115" y="218" text-anchor="middle" font-size="13" fill="#1e3a8a">Tunnel IP 10.8.0.2</text>

  <rect x="260" y="140" width="130" height="100" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="325" y="182" text-anchor="middle" font-size="16" font-weight="bold" fill="#92400e">Wi-Fi / ISP</text>
