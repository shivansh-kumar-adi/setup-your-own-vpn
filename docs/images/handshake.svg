<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Arial, Helvetica, sans-serif">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
  <rect width="900" height="420" fill="#f8fafc"/>
  <text x="450" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#111827">Key Exchange: Who Holds What</text>

  <rect x="60" y="60" width="260" height="300" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="190" y="90" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e3a8a">Laptop (client)</text>
  <text x="190" y="130" text-anchor="middle" font-size="14" fill="#991b1b" font-weight="bold">🔑 Client PRIVATE key</text>
  <text x="190" y="152" text-anchor="middle" font-size="12" fill="#991b1b">never leaves the laptop*</text>
  <text x="190" y="195" text-anchor="middle" font-size="14" fill="#166534" font-weight="bold">🔓 Client PUBLIC key</text>
  <text x="190" y="217" text-anchor="middle" font-size="12" fill="#166534">shared with the server</text>
  <text x="190" y="260" text-anchor="middle" font-size="14" fill="#1e3a8a" font-weight="bold">Knows: server public key</text>
  <text x="190" y="282" text-anchor="middle" font-size="12" fill="#1e3a8a">+ server Endpoint IP:51820</text>

  <rect x="580" y="60" width="260" height="300" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="710" y="90" text-anchor="middle" font-size="18" font-weight="bold" fill="#14532d">VPN Server</text>
  <text x="710" y="130" text-anchor="middle" font-size="14" fill="#991b1b" font-weight="bold">🔑 Server PRIVATE key</text>
  <text x="710" y="152" text-anchor="middle" font-size="12" fill="#991b1b">never leaves the server</text>
  <text x="710" y="195" text-anchor="middle" font-size="14" fill="#166534" font-weight="bold">🔓 Server PUBLIC key</text>
  <text x="710" y="217" text-anchor="middle" font-size="12" fill="#166534">shared with the client</text>
  <text x="710" y="260" text-anchor="middle" font-size="14" fill="#14532d" font-weight="bold">Knows: client public key</text>
  <text x="710" y="282" text-anchor="middle" font-size="12" fill="#14532d">+ allowed IP 10.8.0.2/32</text>

  <line x1="325" y1="170" x2="575" y2="170" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <text x="450" y="162" text-anchor="middle" font-size="12" fill="#374151">1. Handshake initiation</text>
  <line x1="575" y1="230" x2="325" y2="230" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <text x="450" y="222" text-anchor="middle" font-size="12" fill="#374151">2. Handshake response</text>
  <line x1="325" y1="300" x2="575" y2="300" stroke="#16a34a" stroke-width="4" marker-end="url(#a)"/>
  <line x1="575" y1="320" x2="325" y2="320" stroke="#16a34a" stroke-width="4" marker-end="url(#a)"/>
  <text x="450" y="292" text-anchor="middle" font-size="12" fill="#14532d" font-weight="bold">3. Encrypted data both ways</text>
  <text x="450" y="395" text-anchor="middle" font-size="12" fill="#6b7280">*With add-client.sh the client key is generated on the server and placed in the profile you copy; delete the server copy afterwards.</text>
</svg>
